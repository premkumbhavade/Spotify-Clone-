<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utility.css">

    <title>Spotify - Web Player</title>
</head>

<body>

    <div class="container flex bg-black">

        <!-- LEFT SIDEBAR -->
        <div class="left">

            <div class="close">
                <img width="30" class="invert" src="img/close.svg" alt="Close">
            </div>

            <!-- HOME -->
            <div class="home bg-grey rounded m-1 p-1">

                <div class="logo">
                    <img width="110" class="invert" src="img/logo.svg" alt="Spotify">
                </div>

                <ul>
                    <li>
                        <img class="invert" src="img/home.svg" alt="Home">
                        Home
                    </li>

                    <li>
                        <img class="invert" src="img/search.svg" alt="Search">
                        Search
                    </li>
                </ul>

            </div>


            <!-- LIBRARY -->
            <div class="library bg-grey rounded m-1 p-1">

                <div class="heading">

                    <img class="invert" src="img/playlist.svg" alt="Library">

                    <h2>Your Library</h2>

                </div>


                <!-- SONG LIST -->
                <div class="songList">

                    <ul>
                        <!-- Songs will be added using JavaScript -->
                    </ul>

                </div>


                <!-- FOOTER -->
                <div class="footer">

                    <div>
                        <a href="#">
                            <span>Legal</span>
                        </a>
                    </div>

                    <div>
                        <a href="#">
                            <span>Privacy Center</span>
                        </a>
                    </div>

                    <div>
                        <a href="#">
                            <span>Privacy Policy</span>
                        </a>
                    </div>

                    <div>
                        <a href="#">
                            <span>Cookies</span>
                        </a>
                    </div>

                    <div>
                        <a href="#">
                            <span>About Ads</span>
                        </a>
                    </div>

                    <div>
                        <a href="#">
                            <span>Accessibility</span>
                        </a>
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SECTION -->
        <div class="right bg-grey rounded">


            <!-- HEADER -->
            <div class="header">

                <div class="nav">

                    <div class="hamburgerContainer">

                        <img width="40"
                             class="invert hamburger"
                             src="img/hamburger.svg"
                             alt="Menu">

                        <!-- Back -->
                        <svg width="24"
                             height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             xmlns="http://www.w3.org/2000/svg">

                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round" />

                        </svg>


                        <!-- Forward -->
                        <svg width="24"
                             height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             xmlns="http://www.w3.org/2000/svg">

                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round" />

                        </svg>

                    </div>

                </div>


                <div class="buttons">

                    <button class="signupbtn">
                        Sign up
                    </button>

                    <button class="loginbtn">
                        Log in
                    </button>

                </div>

            </div>


            <!-- PLAYLISTS -->
            <div class="spotifyPlaylists">

                <h1>Spotify Playlists</h1>

                <!-- ALBUM CARDS -->
                <div class="cardContainer">

                    <!-- Cards generated by JavaScript -->

                </div>


                <!-- PLAYBAR -->
                <div class="playbar">

                    <!-- SEEK BAR -->
                    <div class="seekbar">

                        <div class="circle"></div>

                    </div>


                    <div class="abovebar">


                        <!-- CURRENT SONG -->
                        <div class="songinfo">
                            No song selected
                        </div>


                        <!-- CONTROLS -->
                        <div class="songbuttons">

                            <img width="35"
                                 id="previous"
                                 src="img/prevsong.svg"
                                 alt="Previous">

                            <img width="35"
                                 id="play"
                                 src="img/play.svg"
                                 alt="Play">

                            <img width="35"
                                 id="next"
                                 src="img/nextsong.svg"
                                 alt="Next">

                        </div>


                        <!-- TIME + VOLUME -->
                        <div class="timevol">

                            <div class="songtime">
                                00:00 / 00:00
                            </div>

                            <div class="volume">

                                <img width="25"
                                     src="img/volume.svg"
                                     alt="Volume">

                                <div class="range">

                                    <input
                                        type="range"
                                        min="0"
                                        max="100"
                                        value="100"
                                        name="volume">

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
